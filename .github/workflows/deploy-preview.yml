name: Deploy IT LifeHacks News preview

on:
  push:
    branches:
      - preview/it-lifehacks-news
    paths:
      - 'preview/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./preview
      - id: deployment
        uses: actions/deploy-pages@v4
